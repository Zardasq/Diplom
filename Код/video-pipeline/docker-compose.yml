// Command api-gateway implements steps 1-4 of the pipeline:
// accept upload -> store original in MinIO -> write PENDING row + outbox
// event in Postgres. The actual Kafka publish is done by outbox-relay.
package main

import (
	"context"
	"log/slog"
	"net/http"
	"os"
	"os/signal"
	"syscall"
	"time"

	"video-pipeline/internal/api"
	"video-pipeline/internal/config"
	"video-pipeline/internal/storage"
)

func main() {
	ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
	defer stop()

	cfg := config.Load()

	pg, err := storage.NewPostgres(ctx, cfg.PostgresDSN)
	if err != nil {
		slog.Error("failed to connect to postgres", "err", err)
		os.Exit(1)
	}
	defer pg.Close()

	minioClient, err := storage.NewMinIO(ctx, cfg.MinIOEndpoint, cfg.MinIOAccessKey, cfg.MinIOSecretKey, cfg.MinIOBucket, cfg.MinIOUseSSL)
	if err != nil {
		slog.Error("failed to connect to minio", "err", err)
		os.Exit(1)
	}

	handler := api.NewHandler(pg, minioClient, cfg.TopicVideoTasks)
	router := api.NewRouter(handler)

	srv := &http.Server{
		Addr:    ":" + cfg.APIHTTPPort,
		Handler: router,
	}

	go func() {
		slog.Info("api-gateway listening", "port", cfg.APIHTTPPort)
		if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {
			slog.Error("http server error", "err", err)
			os.Exit(1)
		}
	}()

	<-ctx.Done()
	slog.Info("shutting down api-gateway")
	shutdownCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
	defer cancel()
	_ = srv.Shutdown(shutdownCtx)
}
